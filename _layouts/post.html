---
layout: base
---

<div class="content">
    <div class="news-post">
        <h1>{{ page.title }}</h1>
        <p class="post-date">{{ page.date | date: "%B %d, %Y" }}</p>
        <p class="post-author">By {{ page.author | default: site.author | default: "Themadpunter" }}</p>
        {{ content }}
    </div>
    <p><a href="/news.html">← Back to News</a></p>
</div>
