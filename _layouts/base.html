<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<title>{{ page.title | default: site.title | default: "Appel Community Site" }}</title>

	<meta name="description" content="{{ site.description | default: "A website for the game Appel, a game made on Scratch by Griffpatch, and its community." }}">
	<meta name="keywords" content="{{ site.keywords | default: "appel, platformer, scratch, community" }}">
	<meta name="author" content="{% if page.layout == "post" and page.author %}{{ page.author }}{% else %}{{ site.author | default: "Themadpunter" }}{% endif %}">

	<link rel="canonical" href="{{ site.url | default: "https://appelgame.net" }}{{ page.url | replace: 'index.html', '' }}">
	<meta property="og:title" content="{{ page.og_title | default: page.title | default: site.title | default: "Appel Community Site" }}">
	<meta property="og:description" content="{{ site.description | default: "A website for the game Appel, a game made on Scratch by Griffpatch, and its community." }}">
	<meta property="og:type" content="website">
	<meta property="og:url" content="{{ site.url | default: "https://appelgame.net" }}{{ page.url | replace: 'index.html', '' }}">
	<meta property="og:image" content="{{ site.og_image | default: "https://appelgame.net/static/icon.png" }}">

	<meta name="twitter:card" content="{{ site.twitter_card | default: "summary_large_image" }}">
	<meta name="twitter:title" content="{{ page.title | default: site.title | default: "Appel Community Site" }}">
	<meta name="twitter:description" content="{{ site.description | default: "A website for the game Appel, a game made on Scratch by Griffpatch, and its community." }}">
	<meta name="twitter:image" content="{{ site.og_image | default: "https://appelgame.net/static/icon.png" }}">
	<meta name="theme-color" content="{{ site.theme_color | default: "#ffffff" }}">
    
	<link rel="stylesheet" href="{{ "/static/style.css" | relative_url }}">
	<link rel="icon" href="{{ "/static/icon.png" | relative_url }}" type="image/png">
</head>
<body>
	{{ content }}
</body>
</html>
